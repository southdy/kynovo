name: Nightly

# The safety net: release-sized fuzzing, the 24-round soak, coverage and a UBSan trap build.
# These are too slow for a pull request, so they run once a day and can be started by hand.

on:
  schedule:
    - cron: '17 18 * * *'   # 18:17 UTC = 02:17 Asia/Shanghai
  workflow_dispatch:
  push:
    tags: ['v*']            # pushing a tag asks for a full cloud gate: works over SSH, no token

permissions:
  contents: write   # only so the failure-log publisher below can push
  issues: write     # only so a red run can open/update its own issue

jobs:
  full-gate:
    name: full regression + coverage + UBSan
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install the MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python

      - name: Record the toolchain
        run: gcc --version | head -1

      - name: Full regression gate (20k fuzz iterations, 2000 candidate clusters, 24-round soak)
        run: |
          ./build.sh regress full 2>&1 | tee regress-full.log
          tail -1 regress-full.log >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage over every driver
        run: |
          ./build.sh coverage 2>&1 | tee coverage.log
          tail -20 coverage.log >> "$GITHUB_STEP_SUMMARY"

      - name: UBSan trap build and run
        run: ./build.sh run-sanitize 2>&1 | tee sanitize.log

      # Same diagnostics channel as ci.yml, on its own branch so a nightly failure cannot clobber a
      # pull-request failure (and vice versa): a public branch is readable with a plain git fetch.
      - name: Publish logs on failure
        if: failure()
        shell: bash
        run: |
          set -e
          rm -rf nightly-logs
          mkdir -p nightly-logs
          cp -f regress-full.log coverage.log sanitize.log nightly-logs/ 2>/dev/null || true
          cp -f build/regress/*.log nightly-logs/ 2>/dev/null || true
          {
            echo "run:    $GITHUB_RUN_ID"
            echo "sha:    $GITHUB_SHA"
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner gcc: $(gcc --version 2>/dev/null | head -1)"
            echo
            echo "--- gate verdict lines ---"
            grep -h 'GATE\|' nightly-logs/*.log 2>/dev/null | tail -40 || true
          } > nightly-logs/SUMMARY.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs-nightly
          git add -f nightly-logs
          git commit -m "Nightly failure logs for ${GITHUB_SHA}" || exit 0
          git push -f origin ci-logs-nightly

      - name: Open or update an issue for this failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          title="Nightly red"
          {
            printf 'Workflow: `%s`\nRun: %s/%s/actions/runs/%s\nCommit: `%s`\n\n' \
              "$GITHUB_WORKFLOW" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA"
            printf 'Gate verdict lines:\n\n```\n'
            grep -h '^GATE|' regress-full.log 2>/dev/null | tail -30 || true
            grep -h '^REGRESS|' regress-full.log 2>/dev/null | tail -1 || true
            printf '```\n\nDiagnostics branch: `ci-logs-nightly`.\n'
          } > issue-body.md
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body-file issue-body.md; else gh issue create --title "$title" --body-file issue-body.md; fi

      # One issue per kind of failure, not one per commit: the title is stable (the SHA lives in the
      # body), so repeated reds comment on the same issue, and a green run on main closes it again.
      - name: Close the failure issue when main is green again
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          num="$(gh issue list --state open --search "Nightly red in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "Green again at ${GITHUB_SHA:0:7} (run $GITHUB_RUN_ID)."
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs
          path: |
            regress-full.log
            coverage.log
            sanitize.log
            build/regress/*.log
          if-no-files-found: ignore
