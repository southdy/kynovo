name: Nightly

# The safety net: release-sized fuzzing, the 24-round soak, coverage and a UBSan trap build.
# These are too slow for a pull request, so they run once a day and can be started by hand.

on:
  schedule:
    - cron: '17 18 * * *'   # 18:17 UTC = 02:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write   # only so the failure-log publisher below can push

jobs:
  full-gate:
    name: full regression + coverage + UBSan
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install the MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python

      - name: Record the toolchain
        run: gcc --version | head -1

      - name: Full regression gate (20k fuzz iterations, 2000 candidate clusters, 24-round soak)
        run: |
          ./build.sh regress full 2>&1 | tee regress-full.log
          tail -1 regress-full.log >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage over every driver
        run: |
          ./build.sh coverage 2>&1 | tee coverage.log
          tail -20 coverage.log >> "$GITHUB_STEP_SUMMARY"

      - name: UBSan trap build and run
        run: ./build.sh run-sanitize 2>&1 | tee sanitize.log

      # Same diagnostics channel as ci.yml, on its own branch so a nightly failure cannot clobber a
      # pull-request failure (and vice versa): a public branch is readable with a plain git fetch.
      - name: Publish logs on failure
        if: failure()
        shell: bash
        run: |
          set -e
          rm -rf nightly-logs
          mkdir -p nightly-logs
          cp -f regress-full.log coverage.log sanitize.log nightly-logs/ 2>/dev/null || true
          cp -f build/regress/*.log nightly-logs/ 2>/dev/null || true
          {
            echo "run:    $GITHUB_RUN_ID"
            echo "sha:    $GITHUB_SHA"
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner gcc: $(gcc --version 2>/dev/null | head -1)"
            echo
            echo "--- gate verdict lines ---"
            grep -h 'GATE\|' nightly-logs/*.log 2>/dev/null | tail -40 || true
          } > nightly-logs/SUMMARY.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs-nightly
          git add -f nightly-logs
          git commit -m "Nightly failure logs for ${GITHUB_SHA}" || exit 0
          git push -f origin ci-logs-nightly

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs
          path: |
            regress-full.log
            coverage.log
            sanitize.log
            build/regress/*.log
          if-no-files-found: ignore
