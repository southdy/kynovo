name: CI

# Every push and pull request runs the SAME gate a developer runs locally:
# `./build.sh regress fuzz`, whose last line is machine-readable.  The gate itself
# asserts the 0-warning build and refuses to pass a layer that produces no verdict
# line, so a green run here means real data, not an empty run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # also runnable by hand (and triggerable by an agent fixing a red gate)

permissions:
  contents: write   # only so the failure-log publisher below can push to ci-logs
  issues: write     # only so a red run can open/update its own issue

jobs:
  gate:
    name: build + unit + selftest + smoke + fast fuzz (MSYS2 MinGW-w64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install the MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python

      # CI and the maintainer's machine use different gcc builds on purpose (the local one is
      # pinned); record what actually ran so a failure can be attributed to a toolchain difference.
      - name: Record the toolchain
        run: |
          gcc --version | head -1
          python --version

      # Hard project constraint: LF everywhere.  A CRLF file breaks the shell harnesses and shows up
      # as a mysterious syntax error much later, so it is checked directly.
      - name: Assert LF line endings in every tracked file
        run: |
          bad="$(git ls-files --eol | grep -Ei '(i|w)/crlf' || true)"
          if [ -n "$bad" ]; then
            echo "::error::CRLF in tracked files - this project requires LF everywhere"
            echo "$bad"
            exit 1
          fi
          echo "LF ok ($(git ls-files --eol | wc -l) tracked files checked)"

      - name: Regression gate
        run: |
          ./build.sh regress fuzz 2>&1 | tee regress.log
          tail -1 regress.log >> "$GITHUB_STEP_SUMMARY"

      # Diagnostics channel: Actions logs cannot be read without authentication, so when the gate
      # fails the per-layer logs are pushed to a `ci-logs` branch.  A public branch is readable with
      # plain `git fetch`, which keeps CI failures self-diagnosable.  "[skip ci]" prevents the push
      # from starting another run.
      - name: Publish gate logs on failure
        if: failure()
        shell: bash
        run: |
          set -e
          rm -rf ci-logs
          mkdir -p ci-logs
          cp -f build/regress/*.log ci-logs/ 2>/dev/null || true
          # the step's stdout carries the GATE| verdict lines; without it the summary is empty
          cp -f regress*.log ci-logs/ 2>/dev/null || true
          {
            echo "run:    $GITHUB_RUN_ID"
            echo "sha:    $GITHUB_SHA"
            echo "ref:    $GITHUB_REF"
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner gcc: $(gcc --version 2>/dev/null | head -1)"
            echo
            echo "--- gate verdict lines ---"
            grep -h 'GATE|' ci-logs/*.log 2>/dev/null || true
          } > ci-logs/SUMMARY.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-logs
          git commit -m "CI failure logs for ${GITHUB_SHA} [skip ci]" || exit 0
          git push -f origin ci-logs

      # A red run reports itself into the issue tracker.  The cloud owns this so it works when the
      # maintainer's machine is off, and it uses the job's own GITHUB_TOKEN so no personal token has
      # to exist anywhere.  continue-on-error: a reporting failure must never mask the real one.
      - name: Open or update an issue for this failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          title="CI red on main at ${GITHUB_SHA:0:7}"
          {
            printf 'Workflow: `%s`\nRun: %s/%s/actions/runs/%s\nCommit: `%s`\n\n' \
              "$GITHUB_WORKFLOW" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA"
            printf 'Gate verdict lines:\n\n```\n'
            grep -h '^GATE|' regress.log 2>/dev/null | tail -20 || true
            grep -h '^REGRESS|' regress.log 2>/dev/null | tail -1 || true
            printf '```\n\nDiagnostics branch: `ci-logs` (`git fetch origin ci-logs`; see ci-logs/SUMMARY.txt).\n'
          } > issue-body.md
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "$title" --body-file issue-body.md
          fi

      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regress-logs
          path: build/regress/*.log
          if-no-files-found: ignore
